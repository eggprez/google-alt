# Nginx Proxy Manager → proxy host search.bindel.glass → Advanced tab → "Custom Nginx Configuration".
# Forward host/port on the Details tab: the Docker host IP and port 2039 (scheme http).
# Replace the TinyAuth address and the X-Proxy-Secret value with your own.

location /tinyauth {
    internal;
    proxy_pass http://192.168.1.88:2016/api/auth/nginx;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Uri   $request_uri;
}

location / {
    auth_request /tinyauth;
    auth_request_set $redirection_url $upstream_http_x_tinyauth_location;
    auth_request_set $auth_user  $upstream_http_remote_user;
    auth_request_set $auth_email $upstream_http_remote_email;
    auth_request_set $auth_name  $upstream_http_remote_name;
    error_page 401 403 =302 $redirection_url;

    proxy_pass $forward_scheme://$server:$port;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header Remote-User  $auth_user;
    proxy_set_header Remote-Email $auth_email;
    proxy_set_header Remote-Name  $auth_name;
    proxy_set_header X-Proxy-Secret "change-me";

    # noVNC (the /vnc page) needs websockets.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $http_connection;

    # The overview streams as server-sent events; buffering would hold it back until the end.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
