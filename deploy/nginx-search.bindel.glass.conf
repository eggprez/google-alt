# nginx site for search.bindel.glass, protected by TinyAuth.
# Adjust: certificate paths, the tinyauth upstream (container name/IP and port), and the app upstream.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name search.bindel.glass;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name search.bindel.glass;

    ssl_certificate     /etc/letsencrypt/live/bindel.glass/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bindel.glass/privkey.pem;

    # Do not let search engines index the proxy.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # TinyAuth auth request (https://tinyauth.app docs, nginx flavour).
    location = /tinyauth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/auth/nginx;   # <- your tinyauth instance
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header x-forwarded-for $remote_addr;
        proxy_set_header x-real-ip $remote_addr;
        proxy_set_header x-forwarded-proto $scheme;
        proxy_set_header x-forwarded-host $http_host;
        proxy_set_header x-forwarded-uri $request_uri;
    }

    # Unauthenticated: needed for Firefox's "add search engine" discovery and the favicon.
    location = /opensearch.xml { proxy_pass http://127.0.0.1:8080; }
    location = /favicon.ico    { proxy_pass http://127.0.0.1:8080; }

    location / {
        auth_request /tinyauth;
        auth_request_set $redirection_url $upstream_http_x_tinyauth_location;
        error_page 401 403 =302 $redirection_url;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # noVNC websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Claude overviews can take a couple of minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
