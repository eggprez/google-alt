name: probe-package-visibility
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          printf 'FROM busybox\nLABEL org.opencontainers.image.source=https://github.com/${{ github.repository }}\n' > Dockerfile
          docker build -t ghcr.io/eggprez/galt-probe:latest .
          docker push ghcr.io/eggprez/galt-probe:latest
